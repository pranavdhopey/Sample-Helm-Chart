sample-app1:
  enabled: true   
  app:
    replicaCount: 1
    image:
      repository: httpd # argoproj/rollouts-demo
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: "latest"
    containerPort: 80  
    imagePullSecrets: []
    nameOverride: ""
    fullnameOverride: ""
    labels: 
      env: dev
    podAnnotations: {}
    podSecurityContext: {}
      # fsGroup: 2000
    securityContext: {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000  
    resources: {}
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi
    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3     
    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3   
    nodeSelector: {}
    tolerations: []
    affinity: {}
    volumes:
    - name: podinfo
      downwardAPI:
        items:
        - path: "labels"
          fieldRef:
            fieldPath: metadata.labels
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo    
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  service:
    name: sample-app1-service
    type: ClusterIP
    targetPort: 80
    annotations:  
      cloud.google.com/backend-config: '{"default": "sample-app1-backendconfig"}'
      cloud.google.com/neg: '{"ingress": true}'
  backendConfig:
    name: sample-app1-backendconfig
    iap:
      enabled: false
      oauthclientCredentials:
        secretName: app1-iap-secret
    healthCheck:
      checkIntervalSec: 5
      timeoutSec: 5
      healthyThreshold: 2
      unhealthyThreshold: 2
      type: HTTP
      requestPath: /
      port: 80
    # securityPolicyName: "example-security-policy"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
  pdb:
    enabled: false
    maxUnavailable: 1
  env: []
    # - name: HOST_DNS
    #   value: http://app1.goinit.net/ 
  envFromSecrets: []
    # - name: DB_USERNAME
    #   secretName: k8s-secret
    #   secretKey: DB_USERNAME
  configMap:
    enabled: false
    name: sample-app1
    data:
      key1: value1
  envFromconfigMap: []
    # - name: APP_CONFIG
    #   configMapName: app-config
    #   configMapKey: config-key
  
  
