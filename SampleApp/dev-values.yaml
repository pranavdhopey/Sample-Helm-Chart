serviceAccount:
  create: true
  annotations: 
    iam.gke.io/gcp-service-account: cloudtaskumesh@umesh-dev-gcp-412809.iam.gserviceaccount.com	
  labels:
    app: sampleapp
  name: "sampleapp"

managedCertificateEnabled: false
managedCertificate:
  name: sampleapp-certificate
  domains: 
    - app1-dev.goinit.net
    - app2-dev.goinit.net

frontendConfigEnabled: false
frontendConfig:
  name: sampleapp-frontend-config
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
  # sslPolicy: gke-ingress-ssl-policy

ingress:
  enabled: true
  name: sampleapp-ingress
  className: ""
  annotations: 
    kubernetes.io/ingress.class: gce
    # networking.gke.io/managed-certificates: "hello-apps-certificate" 
    # networking.gke.io/v1beta1.FrontendConfig: "hello-apps-frontend-config"
  hosts:
    - host: app1.goinit.net
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80
    - host: app2.goinit.net
      http:
        paths:
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2
                port: 
                  number: 80


internal_ingress:
  enabled: true
  name: sampleapp-internal-ingress
  className: ""
  annotations: 
    kubernetes.io/ingress.class: gce-internal
    # networking.gke.io/managed-certificates: "hello-apps-certificate" 
    # networking.gke.io/v1beta1.FrontendConfig: "hello-apps-frontend-config"
  hosts:
    - host: app1.goinit.net
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80
    - host: app2.goinit.net
      http:
        paths:
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2
                port: 
                  number: 80
