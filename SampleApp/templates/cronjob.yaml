{{- range $job := .Values.jobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $job.name }}
  labels:
    {{- toYaml $job.labels | nindent 4 }}
spec:
  concurrencyPolicy: {{ $job.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit }}
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ $job.timeZone }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- toYaml $job.labels | nindent 12 }}
        spec:
          restartPolicy: {{ $job.restartPolicy }}
          {{- with $job.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          serviceAccountName: {{ $job.serviceAccount }}
          securityContext:
            {{- toYaml $job.podSecurityContext | nindent 12 }}
          containers:
          - image: {{ $job.image.repository }}:{{ $job.image.tag }}
            imagePullPolicy: {{ $job.image.imagePullPolicy }}
            name: {{ $job.name }}
            securityContext:
              {{- toYaml $job.securityContext | nindent 14 }}
            {{- with $job.env }}
            env:
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.envFrom }}
            envFrom:
            {{ toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.command }}
            command:
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.args }}
            args:
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.resources }}
            resources:
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.volumeMounts }}
            volumeMounts:
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $job.nodeSelector }}
          nodeSelector:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.affinity }}
          affinity:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.tolerations }}
          tolerations:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.volumes }}
          volumes:
          {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}